<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ورود | لیلیان</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../src/css/main.css" />
  </head>
  <body class="bg-[#f4f4f4] font-sans">
    <!-- start login page -->
    <div class="w-full min-h-screen flex items-center justify-center p-4">
      <!-- کانتینر اصلی (دو ستونی در دسکتاپ) -->
      <div
        class="w-full max-w-5xl bg-white rounded-2xl shadow-2xl overflow-hidden flex flex-col md:flex-row h-auto md:h-162.5"
      >
        <!-- ================= 1. بخش عکس (سمت چپ) ================= -->
        <!-- در موبایل مخفی میشه و در دسکتاپ نشون داده میشه -->
        <div class="hidden md:block w-1/2 relative bg-[#e8e6e3]">
          <img
            src="../src/images/men-organize.png"
            alt="استایل لیلیان"
            class="absolute inset-0 w-full h-full object-cover"
          />
          <div class="absolute inset-0 bg-black/10"></div>
          <div class="absolute bottom-8 right-8 text-white z-10">
            <h2 class="text-3xl font-bold mb-2 drop-shadow-lg">لیلیان</h2>
            <p class="text-sm drop-shadow-md">
              جایی برای استایل منحصر به فرد شما
            </p>
          </div>
        </div>

        <!-- ================= 2. بخش فرم (سمت راست) ================= -->
        <div
          class="w-full md:w-1/2 p-8 md:p-12 flex flex-col justify-center relative"
        >
          <!-- دکمه بستن (برگشت به صفحه اصلی) -->
          <a
            href="../index.html"
            class="absolute top-6 left-6 text-gray-400 hover:text-black transition-colors"
          >
            <svg
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="1.5"
                d="M6 18L18 6M6 6l12 12"
              ></path>
            </svg>
          </a>

          <!-- عنوان -->
          <div class="mb-10 text-center">
            <h1 class="text-2xl font-bold text-gray-900 mb-2">خوش آمدید</h1>
            <p class="text-gray-500 text-sm">
              برای ادامه، وارد حساب کاربری خود شوید.
            </p>
          </div>

          <!-- فرم -->
          <form class="flex flex-col gap-5">
            <!-- فیلد موبایل -->
            <div class="flex flex-col gap-1">
              <label class="text-xs font-bold text-gray-700">شماره همراه</label>
              <input
                type="text"
                placeholder="۰۹۱۲..."
                class="w-full bg-[#f9f9f9] border border-gray-200 rounded-lg px-4 py-3.5 text-sm focus:outline-none focus:border-gray-800 focus:bg-white transition-all text-left"
                dir="ltr"
              />
            </div>

            <!-- فیلد رمز عبور -->
            <div class="flex flex-col gap-1">
              <label class="text-xs font-bold text-gray-700">کلمه عبور</label>
              <div class="relative">
                <input
                  type="password"
                  placeholder="••••••••"
                  class="w-full bg-[#f9f9f9] border border-gray-200 rounded-lg px-4 py-3.5 text-sm focus:outline-none focus:border-gray-800 focus:bg-white transition-all text-left"
                  dir="ltr"
                />
                <!-- آیکون چشم -->
                <button
                  type="button"
                  class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-700"
                >
                  <svg
                    class="w-5 h-5"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="1.5"
                      d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                    ></path>
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="1.5"
                      d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                    ></path>
                  </svg>
                </button>
              </div>
            </div>

            <!-- فراموشی رمز -->
            <div class="flex justify-end mt-1">
              <a
                href="#"
                class="text-xs text-gray-500 hover:text-black transition-colors"
                >فراموشی رمز عبور؟</a
              >
            </div>

            <!-- 🟢 دکمه ورود (اصلاح شد - بدون رفرش) -->
            <button
              type="button"
              onclick="
                localStorage.setItem('isLoggedIn', 'true');
                window.location.href = '../index.html';
              "
              class="w-full bg-gray-900 text-white py-3.5 rounded-lg text-sm font-bold hover:bg-black transition-all mt-2"
            >
              ورود به حساب
            </button>

            <!-- جداکننده -->
            <div class="flex items-center gap-3 my-2">
              <div class="flex-1 h-px bg-gray-200"></div>
              <span class="text-[10px] text-gray-400">یا ادامه با</span>
              <div class="flex-1 h-px bg-gray-200"></div>
            </div>

            <!-- دکمه‌های جایگزین -->
            <div class="flex items-center gap-3">
              <button
                type="button"
                class="flex-1 border border-gray-200 bg-white rounded-lg py-2.5 flex items-center justify-center gap-2 text-xs text-gray-600 hover:bg-gray-50 transition-colors"
              >
                <svg class="w-4 h-4" viewBox="0 0 24 24">
                  <path
                    fill="#4285F4"
                    d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                  />
                  <path
                    fill="#34A853"
                    d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                  />
                  <path
                    fill="#FBBC05"
                    d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                  />
                  <path
                    fill="#EA4335"
                    d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                  />
                </svg>
                گوگل
              </button>
              <button
                type="button"
                class="flex-1 border border-gray-200 bg-white rounded-lg py-2.5 flex items-center justify-center gap-2 text-xs text-gray-600 hover:bg-gray-50 transition-colors"
              >
                <svg
                  class="w-4 h-4"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="1.5"
                    d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"
                  ></path>
                </svg>
                ایمیل
              </button>
            </div>
          </form>

          <!-- دکمه‌های زنانه و مردانه (پایین فرم) -->
          <div
            class="mt-8 pt-6 border-t border-gray-100 flex items-center justify-between text-xs text-gray-500"
          >
            <span
              >هنوز ثبت نام نکردی؟
              <a href="#" class="text-gray-900 font-bold hover:underline"
                >ثبت‌نام</a
              ></span
            >

            <div class="flex items-center gap-3">
              <a
                href="../zanane.html"
                class="hover:text-black font-bold transition-colors"
                >زنانه</a
              >
              <span class="text-gray-300">|</span>
              <a
                href="../mardane.html"
                class="hover:text-black font-bold transition-colors"
                >مردانه</a
              >
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- end login page -->
  </body>
</html>
