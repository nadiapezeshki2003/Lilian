<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- start login page -->
<div class="w-full min-h-screen bg-[#5e5e5e] relative flex flex-col items-center justify-center py-12 px-4 font-sans dir-rtl">

  <!-- ================= 1. کارت ورود ================= -->
  <div class="bg-white w-full max-w-105 p-8 rounded-sm shadow-xl relative z-10">
    
    <!-- عنوان -->
    <h2 class="text-center text-xl font-bold text-gray-800 mb-8">خوش آمدید</h2>

    <!-- فرم -->
    <form class="flex flex-col gap-4">
      
      <!-- فیلد شماره موبایل -->
      <input 
        type="text" 
        placeholder="شماره همراه" 
        class="w-full border border-gray-300 rounded-sm px-3 py-3 text-sm text-right placeholder-gray-400 focus:outline-none focus:border-gray-500"
      />

      <!-- فیلد رمز عبور با آیکون چشم -->
      <div class="relative">
        <input 
          type="password" 
          placeholder="کلمه عبور" 
          class="w-full border border-gray-300 rounded-sm px-3 py-3 text-sm text-right placeholder-gray-400 focus:outline-none focus:border-gray-500"
        />
        <!-- آیکون چشم (نمایش رمز) -->
        <button type="button" class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
        </button>
      </div>

      <!-- لینک فراموشی رمز -->
      <div class="text-right mt-1">
        <a href="#" class="text-xs text-gray-500 hover:text-black transition-colors">کلمه عبور خود را فراموش کرده‌اید؟</a>
      </div>

      <!-- دکمه ورود -->
      <button type="submit" class="w-full bg-[#2a2a2a] text-white py-3 text-sm font-bold mt-2 hover:bg-black transition-colors rounded-sm">
        ورود
      </button>

      <!-- جداکننده (یا) -->
      <div class="flex items-center gap-3 my-2">
        <div class="flex-1 h-px bg-gray-200"></div>
        <span class="text-xs text-gray-400">یا ورود با</span>
        <div class="flex-1 h-px bg-gray-200"></div>
      </div>

      <!-- دکمه‌های ورود جایگزین -->
      <div class="flex items-center gap-3">
        <!-- ایمیل -->
        <button type="button" class="flex-1 border border-gray-300 rounded-sm py-2.5 flex items-center justify-center gap-2 text-sm text-gray-600 hover:bg-gray-50 transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
          ورود با ایمیل
        </button>
        <!-- گوگل -->
        <button type="button" class="flex-1 border border-gray-300 rounded-sm py-2.5 flex items-center justify-center gap-2 text-sm text-gray-600 hover:bg-gray-50 transition-colors">
          <!-- آیکون گوگل -->
          <svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          ورود با گوگل
        </button>
      </div>

    </form>
  </div>

  <!-- ================= 2. دکمه‌های زنانه و مردانه (پایین کارت) ================= -->
  <div class="flex items-center gap-4 mt-10 z-10">
    <a href="zanane.html" class="bg-white text-gray-800 px-10 py-3 text-sm font-bold rounded-sm hover:bg-gray-100 transition-colors">
      زنانه
    </a>
    <a href="mardane.html" class="bg-white text-gray-800 px-10 py-3 text-sm font-bold rounded-sm hover:bg-gray-100 transition-colors">
      مردانه
    </a>
  </div>

</div>
<!-- end login page -->
</body>
</html>
